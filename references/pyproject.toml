[project]
name = "pptx-skills"
version = "0.1.0"
description = "Local tooling behind the powerpoint-skills plugin"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=5",
    "Pillow>=10.1",
    "jsonschema>=4.21",
]

[project.scripts]
pptx = "pptx_skills.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pptx_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
